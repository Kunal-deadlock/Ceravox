services:
  - type: web
    name: ceravox-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements-cloud.txt
    startCommand: cd backend && python run_cloud.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: CERAVOX_ENVIRONMENT
        value: production
      - key: CERAVOX_DASHBOARD_URL
        value: https://ceravox-nova.vercel.app
      - key: CERAVOX_COOKIE_SECURE
        value: "true"
      - key: CERAVOX_DATABASE_URL
        fromDatabase:
          name: ceravox-db
          property: connectionString
      - key: CERAVOX_GROQ_API_KEY
        sync: false

databases:
  - name: ceravox-db
    plan: free
