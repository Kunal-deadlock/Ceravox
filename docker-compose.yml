services:
  backend:
    build: ./backend
    environment:
      CERAVOX_APP_NAME: Ceravox API
      CERAVOX_ENVIRONMENT: development
      CERAVOX_LOG_LEVEL: INFO
      CERAVOX_DATABASE_URL: sqlite:///./ceravox.db
      CERAVOX_DASHBOARD_URL: http://127.0.0.1:5173
      CERAVOX_OLLAMA_URL: http://ollama:11434
      CERAVOX_ASR_MODEL: base
      CERAVOX_ASR_MODEL_DIR: /app/models/faster-whisper-base
      CERAVOX_ASR_DEVICE: cpu
      CERAVOX_ASR_COMPUTE_TYPE: int8
      CERAVOX_TTS_MODEL: Kokoro-82M
      CERAVOX_TTS_MODEL_DIR: /app/models/kokoro
      CERAVOX_TTS_VOICES_DIR: /app/models/kokoro/voices
      CERAVOX_TTS_VOICES: '["af_heart"]'
      CERAVOX_TTS_DEFAULT_VOICE: af_heart
      CERAVOX_AUDIO_STORAGE_DIR: /app/recordings/tmp
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    volumes:
      - ${CERAVOX_ASR_MODEL_DIR:-./backend/models/faster-whisper-base}:/app/models/faster-whisper-base:ro
      - ${CERAVOX_TTS_MODEL_DIR:-./backend/models/kokoro}:/app/models/kokoro:ro
      - ceravox_data:/app/recordings

  dashboard:
    build: ./dashboard
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
  ceravox_data:
