services:
  backend:
    build: ./backend
    environment:
      CERAVOX_APP_NAME: Ceravox API
      CERAVOX_ENVIRONMENT: development
      CERAVOX_LOG_LEVEL: INFO
      CERAVOX_DATABASE_URL: sqlite:///./ceravox.db
      CERAVOX_DASHBOARD_URL: http://127.0.0.1:5173
      CERAVOX_OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama

  dashboard:
    build: ./dashboard
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
